<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>大模型技术全景 · 从 Transformer 到智能体时代</title>
  <meta name="description" content="系统讲解大语言模型的架构、预训练、对齐、推理与系统实现。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    :root { --theme-color: #1F3A6E; }
    .sidebar { font-size: 15px; }
    .sidebar ul li a { line-height: 1.5; white-space: normal; overflow: visible; text-overflow: clip; }
    .markdown-section { max-width: 820px; font-size: 16px; line-height: 1.85; }
    .markdown-section img { max-width: 100%; }
    .markdown-section h2 { margin-top: 2.2em; }
    .cover-main h1 { font-size: 3rem; letter-spacing: 2px; }
    .cover-main blockquote { font-size: 1.05rem; }
    .cover-main .cover-buttons a { margin: 0 8px; }
    .app-nav { display: none; }
    .github-corner { display: none; }
  </style>
</head>
<body>
  <div id="app">正在加载……</div>

  <script>
    window.$docsify = {
      name: '大模型技术全景',
      loadSidebar: true,
      subMaxLevel: 0,
      coverpage: true,
      homepage: 'README.md',
      auto2top: true,
      autoHeader: false,
      executeScript: true,
      notFoundPage: true,
      search: {
        placeholder: '搜索全书',
        noData: '没有找到相关内容',
        depth: 3
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      mermaid: {
        theme: 'default'
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_coverpage.md': '/_coverpage.md'
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (!window.renderMathInElement) return;
            renderMathInElement(document.querySelector('.markdown-section'), {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\(', right: '\)', display: false },
                { left: '\[', right: '\]', display: true }
              ],
              ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
              throwOnError: false
            });
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.8.0/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
